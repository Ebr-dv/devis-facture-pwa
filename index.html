<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EbRSmartHome |💡|</title>
    <meta name="description" content="Gestion BTP Sécurisée">
    <meta name="theme-color" content="#2563eb">
    <!-- Ajout du manifest pour PWA -->
    <link rel="manifest" href="manifest.json">
    
    <style>
        /* --- 1. VARIABLES & THEME PRO --- */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --secondary: #64748b;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #ca8a04;
            
            --bg-app: #f1f5f9;
            --bg-sidebar: #ffffff;
            --bg-paper: #ffffff;
            
            --text-main: #0f172a;
            --text-muted: #64748b;
            
            --border-light: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            
            --radius: 0.5rem;
            --header-height: 64px;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        [data-theme="dark"] {
            --bg-app: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-paper: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-light: #334155;
            --primary: #3b82f6;
            --primary-hover: #60a5fa;
            --primary-light: #1e293b;
        }

        /* --- 2. RESET & BASE --- */
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: var(--font-sans); 
            background: var(--bg-app); 
            color: var(--text-main); 
            font-size: 14px;
            line-height: 1.5; 
            /* CORRECTION: Utilisation de dvh (dynamic viewport height) pour gérer les barres système mobiles */
            height: 100vh; 
            height: 100dvh; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            transition: background 0.3s, color 0.3s; 
        }
        
        /* --- 3. UTILITY CLASSES --- */
        .hidden { display: none !important; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 0.5rem; }
        .gap-4 { gap: 1rem; }
        .w-full { width: 100%; }
        .mb-2 { margin-bottom: 0.5rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mt-4 { margin-top: 1rem; }
        .text-sm { font-size: 0.875rem; }
        .text-xs { font-size: 0.75rem; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }
        .font-bold { font-weight: 600; }
        .text-muted { color: var(--text-muted); }
        .text-primary { color: var(--primary); }

        /* --- 4. COMPONENTS --- */
        
        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            padding: 0.5rem 1rem; border-radius: var(--radius); font-weight: 500;
            transition: all 0.2s; font-size: 0.875rem; gap: 0.5rem; cursor: pointer; border: 1px solid transparent;
            white-space: nowrap;
        }
        .btn-primary { background: var(--primary); color: white; border-color: var(--primary); box-shadow: var(--shadow-sm); }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
        
        .btn-secondary { background: var(--bg-sidebar); color: var(--text-main); border-color: var(--border-light); }
        .btn-secondary:hover { border-color: var(--text-muted); background: var(--bg-app); }
        
        .btn-success { background: var(--success); color: white; }
        .btn-success:hover { background: #15803d; }
        
        .btn-icon { padding: 0.4rem; border-radius: var(--radius); border: none; background: transparent; color: var(--text-muted); }
        .btn-icon:hover { background: var(--bg-app); color: var(--primary); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Inputs */
        .input-group { margin-bottom: 0.75rem; width: 100%; position: relative; }
        .input-label { display: block; margin-bottom: 0.35rem; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.025em; }
        
        .input-field {
            width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border-light);
            border-radius: var(--radius); background: var(--bg-sidebar); color: var(--text-main);
            font-size: 0.9rem; transition: all 0.2s; font-family: inherit;
        }
        .input-field:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); background: var(--bg-paper); }
        textarea.input-field { resize: vertical; min-height: 70px; line-height: 1.5; }
        
        /* Inputs "Paper Style" (Transparent until focus) */
        .paper-input {
            background: transparent !important; border: 1px dashed transparent !important; border-radius: 4px; padding: 8px 12px !important;
            color: inherit !important; width: 100% !important; transition: all 0.2s; display: block;
            box-sizing: border-box;
            /* Allow text to wrap naturally */
            white-space: normal;
            line-height: 1.4;
            overflow: hidden; /* Hide scrollbar in editor view */
        }
        .paper-input:hover { background: var(--bg-app) !important; border-color: var(--border-light) !important; }
        .paper-input:focus { background: var(--bg-paper) !important; border: 1px solid var(--primary) !important; box-shadow: 0 0 0 2px var(--primary-light) !important; outline: none !important; }
        
        .input-sm { width: 100%; padding: 0.4rem; font-size: 0.9rem; text-align: right; font-weight: 600; }
        .input-xs { width: 50px; padding: 0.2rem; font-size: 0.8rem; text-align: center; }

        /* Cards */
        .card { background: var(--bg-paper); border-radius: var(--radius); box-shadow: var(--shadow-sm); border: 1px solid var(--border-light); }

        /* --- 5. LAYOUT --- */
        
        /* Header */
        header {
            height: var(--header-height); background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-light);
            padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; 
            z-index: 50; flex-shrink: 0; position: relative;
        }
        [data-theme="dark"] header { background: rgba(30, 41, 59, 0.8); }

        .logo { font-size: 1.1rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 0.6rem; letter-spacing: -0.02em; }
        
        /* Status Dot (Indicateur de connexion) */
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; margin-left: 8px; transition: background 0.3s, box-shadow 0.3s;
        }
        .status-dot.online { background: var(--success); box-shadow: 0 0 6px var(--success); }

        /* Dropdown */
        .dropdown { position: relative; }
        .dropdown-content {
            position: absolute; top: 120%; right: 0; width: 240px; background: var(--bg-paper);
            border: 1px solid var(--border-light); border-radius: var(--radius); box-shadow: var(--shadow-lg);
            display: none; flex-direction: column; overflow: hidden; z-index: 100; padding: 0.5rem;
        }
        .dropdown.active .dropdown-content { display: flex; animation: slideDown 0.1s ease-out; }
        .dropdown-item { padding: 0.6rem 0.8rem; font-size: 0.875rem; border-radius: 4px; transition: background 0.1s; display: flex; align-items: center; gap: 0.6rem; color: var(--text-main); cursor: pointer; }
        .dropdown-item:hover { background: var(--bg-app); }
        .dropdown-item.danger { color: var(--danger); }
        
        /* Main Workspace */
        main { flex: 1; display: flex; overflow: hidden; position: relative; }

        /* Sidebar */
        .sidebar {
            width: 320px; background: var(--bg-sidebar); border-right: 1px solid var(--border-light);
            display: flex; flex-direction: column; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 20;
            flex-shrink: 0;
        }
        .sidebar.collapsed {
            width: 0;
            opacity: 0;
            transform: translateX(-20px);
        }

        .sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border-light); background: var(--bg-sidebar); }
        .sidebar-content { 
            flex: 1; overflow-y: auto; padding: 0.75rem;
            /* CORRECTION: Ajout d'espace en bas pour éviter que le dernier item soit caché sous la barre Android/iOS */
            padding-bottom: 100px; 
        }
        
        /* Sidebar Items (Products) */
        .product-item {
            padding: 0.75rem; border: 1px solid var(--border-light); border-radius: var(--radius);
            margin-bottom: 0.5rem; cursor: pointer; transition: all 0.2s; 
            display: flex; justify-content: space-between; align-items: center; background: var(--bg-paper);
        }
        .product-item:hover { border-color: var(--primary); background: var(--primary-light); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
        .product-info h4 { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.2rem; line-height: 1.3; }
        .product-info p { font-size: 0.75rem; color: var(--text-muted); }
        .product-price { font-weight: 700; color: var(--primary); font-size: 0.85rem; white-space: nowrap; margin-left: 0.75rem; }
        .fav-star { color: #cbd5e1; transition: color 0.2s; }
        .fav-star.active { color: var(--warning); }

        /* Editor / Paper */
        .editor { flex: 1; padding: 2rem; overflow-y: auto; background: var(--bg-app); display: flex; flex-direction: column; align-items: center; }
        .paper {
            width: 100%; max-width: 850px; background: var(--bg-paper); min-height: 1000px;
            padding: 3rem 3.5rem; box-shadow: var(--shadow-lg); border-radius: 4px; 
            position: relative; margin-bottom: 3rem;
        }

        /* Invoice Elements */
        .doc-header { display: flex; justify-content: space-between; margin-bottom: 3rem; flex-wrap: wrap; gap: 2rem; align-items: flex-start; }
        .doc-title { font-size: 2.25rem; font-weight: 800; color: var(--text-main); text-transform: uppercase; letter-spacing: -1px; line-height: 1; }
        .doc-meta { text-align: right; min-width: 200px; }
        .doc-number { font-size: 1.25rem; color: var(--primary); font-weight: 700; margin-top: 0.25rem; }
        
        .doc-table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
        .doc-table th { 
            padding: 0.75rem 0.5rem; border-bottom: 2px solid var(--border-light); 
            color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; 
        }
        .doc-table td { padding: 0.85rem 0.5rem; border-bottom: 1px solid var(--border-light); vertical-align: middle; }
        .col-action { width: 40px; text-align: center; }
        
        .doc-totals { width: 280px; margin-left: auto; margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-light); }
        .total-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; font-size: 0.9rem; color: var(--text-muted); }
        .total-row.final { font-size: 1.35rem; font-weight: 800; color: var(--text-main); border-top: 2px solid var(--border-light); margin-top: 0.75rem; padding-top: 1rem; }

        /* --- 6. MODALS --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); 
            display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal { background: var(--bg-paper); padding: 2rem; border-radius: var(--radius); width: 90%; max-width: 500px; box-shadow: var(--shadow-lg); border: 1px solid var(--border-light); max-height: 90vh; overflow-y: auto;}
        .modal-header { font-size: 1.25rem; font-weight: 700; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--bg-paper); z-index: 10;}
        
        #lockModal .modal { max-width: 400px; text-align: center; padding: 3rem; overflow: visible; }

        /* --- 7. TOASTS --- */
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 300; display: flex; flex-direction: column; gap: 10px; }
        .toast { 
            padding: 0.85rem 1.25rem; background: var(--text-main); color: var(--bg-paper); 
            border-radius: var(--radius); font-size: 0.875rem; box-shadow: var(--shadow-lg); 
            animation: slideIn 0.3s ease; display: flex; align-items: center; gap: 12px; min-width: 280px; 
        }
        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast.warning { border-left: 4px solid var(--warning); }

        /* --- 8. RESPONSIVE --- */
        @media (max-width: 900px) {
            .paper { padding: 1.5rem; margin-bottom: 1rem; }
            main { flex-direction: column; }
            .sidebar { width: 100%; height: 40vh; border-right: none; border-bottom: 1px solid var(--border-light); order: 2; }
            .sidebar.collapsed { height: 0; opacity: 0; transform: translateY(20px); }
            .editor { height: 60vh; order: 1; padding: 1rem; }
            header { padding: 0 1rem; }
            .doc-title { font-size: 1.5rem; }
            .col-action { display: none; }
            .logo span { display: none; }
            .doc-totals { width: 100%; }
        }

        /* --- 9. PRINT STYLES (Cleanest Output) --- */
        @media print {
            @page { 
                size: A4; 
                margin: 15mm; /* CORRECTION: Marge standard pour l'imprimante */
            }
            
            body { 
                background: white !important; 
                color: black !important; 
                height: auto; overflow: visible; display: block; 
                font-family: 'Times New Roman', serif; 
                -webkit-print-color-adjust: exact; print-color-adjust: exact;
            }
            
            header, .sidebar, .toast-container, .modal-overlay, .editor-actions, .no-print, .btn, .sidebar-toggle-btn, .dropdown-content { display: none !important; }
            
            main, .editor { display: block; overflow: visible; width: 100%; height: auto; padding: 0; margin: 0; background: white !important; }
            
            .paper { 
                box-shadow: none; margin: 0; padding: 0 !important; /* On laisse @page gérer les marges extérieures */
                width: 100%; min-height: auto; 
                border: none !important; border-radius: 0 !important; 
                color: #000 !important; 
                background: #fff !important; 
            }
            
            /* CORRECTION: Inputs et Textareas doivent afficher tout leur contenu */
            .input-field, textarea, .paper-input { 
                border: none !important; background: transparent !important; resize: none !important; 
                padding: 0 !important; 
                
                /* Force la hauteur à s'adapter au contenu */
                height: auto !important; 
                min-height: auto !important;
                max-height: none !important;

                font-family: inherit !important; 
                color: #000 !important; 
                width: 100% !important; /* Prend toute la largeur disponible */
                font-weight: normal; font-size: 11pt; 
                overflow: visible !important; /* Affiche ce qui dépasse */
                box-shadow: none !important; outline: none !important;
                word-wrap: break-word !important; /* Coupe les mots trop longs */
                white-space: pre-wrap !important; /* Respecte les retours à la ligne */
            }
            
            textarea { display: block; } 
            
            .doc-table th { color: #000; border-bottom: 2px solid #000; padding: 8px 0; font-weight: bold; font-family: 'Arial', sans-serif; text-transform: uppercase; font-size: 10pt;}
            .doc-table td { border-bottom: 1px solid #ccc; padding: 8px 0; vertical-align: top; font-size: 11pt;}
            input[type="number"] { -moz-appearance: textfield; appearance: none; text-align: right; width: 100%; font-family: 'Arial', sans-serif; font-weight: bold;}
            
            .doc-totals { width: 100%; max-width: 300px; border-top: 2px solid #000; margin-top: 20px; color: #000 !important; }
            .total-row.final { color: #000; border-top: 2px solid #000; }
            
            .doc-title { color: #000; font-size: 24pt; font-family: 'Arial', sans-serif; margin-bottom: 10px; line-height: 1.2; }
            .doc-number { color: #000; font-size: 16pt; font-family: 'Arial', sans-serif; }
            .col-action { display: none; }
        }

        /* Animations */
        @keyframes slideDown { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="flex items-center gap-2">
            <button class="btn-icon sidebar-toggle-btn" onclick="app.ui.toggleSidebar()" title="Afficher/Masquer le catalogue">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
            </button>
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                EbR Smart Home |💡|
            </div>
            <!-- Indicateur Hors Ligne / En Ligne -->
            <div id="statusDot" class="status-dot" title="État de la connexion"></div>
        </div>
        
        <div class="flex items-center gap-2">
            <button class="btn btn-primary" onclick="app.doc.new()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                <span class="hidden-mobile">Nouveau</span>
            </button>
            
            <div class="nav-menu dropdown" id="settingsDropdown">
                <button class="btn-icon" onclick="app.ui.toggleDropdown('settingsDropdown')" title="Menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoi
